name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # To redeploy or roll back to an older commit, use "Run workflow" and pick
  # that commit's SHA/tag as the ref — no separate rollback input needed.

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── PREVIEW: one throwaway deploy per PR commit, posted back on the PR ──
  # Runs on pull_request only. Skipped for fork PRs so their untrusted code can
  # never read the deploy secrets, and for Dependabot PRs (GitHub runs those
  # without secret access, so the Vercel step would always fail). No approval
  # gate — previews are meant to be fast so you can eyeball the change first.
  # This job's `vercel build` is also the authoritative build check: it builds
  # against the real preview environment and reports as a PR status check.
  deploy-preview:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: write # to comment the preview URL on the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Same Vercel CLI sequence as production, minus every --prod flag, so this
      # pulls the "preview" env and produces a preview (not live) deploy.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── ENVIRONMENT GATE (layers 1 and 2) ──
      # Both read the file `vercel pull` just wrote, so they check the exact values this
      # deployment will run with — not the runner's own empty environment. They run BEFORE
      # `vercel build`, so a misconfigured environment fails the PR check without producing a
      # deployment at all.
      #
      # `vercel build` does its own isolated install, so this npm ci exists only to provide tsx
      # and the connector SDKs to the two gate steps.
      #
      # --require-env-file is the anti-silent-no-op guard: if a Vercel CLI change ever moves the
      # pulled file, these fail loudly instead of passing against nothing.
      - name: Install dependencies
        run: npm ci

      - name: Verify environment configuration
        run: npm run verify:deploy-env -- --environment=preview --require-env-file

      # The placeholder base URL is needed for the same reason `vercel build` needs one: the probe
      # import chain reaches db/client.ts, whose assertRuntimeEnv("web") runs at module load and
      # refuses to start when no base URL resolves. Preview genuinely has none — Vercel injects it
      # per-deployment from VERCEL_URL — so one is supplied here purely to let the module load.
      # No probe reads it, and it is NOT supplied to the shape check above, which must see the
      # real (absent) value rather than a placeholder that would pass its https rule.
      - name: Verify connectors are reachable
        env:
          APP_BASE_URL: https://connector-probe.invalid
        run: npm run connectors:status:live -- --environment=preview --require-env-file

      # `vercel build` runs here, not on Vercel, so Vercel's system variables
      # are absent — including VERCEL_URL, which is what resolves the base URL
      # on a preview deployment. Preview has no stable URL to hardcode (deriving
      # it per-deployment from VERCEL_URL is the point), so the build gets a
      # non-resolvable placeholder and Vercel injects the real URL at runtime.
      #
      # Both names are required, for different reasons:
      #   APP_BASE_URL  — assertRuntimeEnv("web") runs at module load in
      #                   auth.config.ts and db/client.ts, and fails page-data
      #                   collection when no base URL resolves.
      #   NEXTAUTH_URL  — next-auth calls parseUrl(process.env.NEXTAUTH_URL) at
      #                   module scope, and Turbopack substitutes an absent var
      #                   as "" rather than undefined. parseUrl's `??` does not
      #                   catch "", so it reaches new URL("") and throws while
      #                   prerendering the static pages.
      #
      # NEXT_PUBLIC_APP_URL is deliberately NOT set: nothing client-side reads
      # it, so leaving it out keeps a fake origin out of the public bundle.
      - name: Build (prebuilt output)
        run: vercel build
        env:
          APP_BASE_URL: https://vercel-build.invalid
          AUTH_URL: https://vercel-build.invalid
          NEXTAUTH_URL: https://vercel-build.invalid

      - name: Deploy prebuilt output
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt)" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Posted before the smoke test, and unconditionally, so a preview that deploys but fails its
      # smoke still hands you the URL to look at — which is exactly when you want it.
      - name: Comment preview URL on the PR
        if: always() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "🔎 **Preview deployed** for \`${{ github.sha }}\`: ${PREVIEW_URL}"

      # ── ENVIRONMENT GATE (layer 3) ──
      # The only check that exercises the deployed runtime, where Vercel injects the environment
      # and a request is actually served. Layers 1 and 2 cannot see that far.
      - name: Smoke test the preview deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deploy/smoke.mjs "${{ steps.deploy.outputs.url }}"

  # ── PRODUCTION: live deploy on merge to main (never on PRs). ──
  # Gated by the "production" GitHub Environment: a human reviewer must approve
  # before the job (and its secrets) are released — this is the deliberate
  # "promote to production" gate that replaces the old push-to-production-branch
  # step. CI correctness is gated separately, upstream, by branch protection
  # requiring ci.yml to pass before a PR can merge to main.
  #
  # Database migrations are intentionally NOT run here — they remain a manual
  # operator step per docs/operations (AUTH_SECRET-rotation ordering and
  # destructive casts must stay under human control). This job deploys code only.
  deploy-production:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      # Job-level so the worker step's `if:` can read it. Only the boolean is
      # job-wide; the token itself stays scoped to the step that uses it.
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # ── WEB: VERCEL ──
      # Pull production settings/env, let `vercel build --prod` do its own
      # isolated install+build, then upload the prebuilt output. Secrets are
      # declared per-step so no other step can read them.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── ENVIRONMENT GATE (layers 1 and 2) ──
      # Checks the values `vercel pull` just wrote — the exact ones this deploy will run with —
      # before anything is built or promoted. A bad value stops the job here, with production
      # still serving the previous deployment.
      #
      # This gates the CONFIGURATION, which is all that can be gated before the fact: a check
      # against a production deployment that does not exist yet is not possible. The running
      # deployment is covered by the smoke test below, which detects rather than prevents;
      # rolling back is `gh workflow run deploy.yml --ref <last-good-sha>`.
      - name: Install dependencies
        run: npm ci

      - name: Verify environment configuration
        run: npm run verify:deploy-env -- --environment=production --require-env-file

      # No placeholder base URL here, unlike preview: production sets APP_BASE_URL for real, and
      # the shape check above has already failed the job if it is absent or malformed. Supplying
      # one would override the real value in the probe process and hide that.
      - name: Verify connectors are reachable
        run: npm run connectors:status:live -- --environment=production --require-env-file

      - name: Build (prebuilt output)
        run: vercel build --prod

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ── WORKER: RAILWAY (guarded) ──
      # Promotes the Railway worker in lockstep with the web deploy, behind the
      # same production approval gate. GUARDED: runs only when RAILWAY_TOKEN is
      # set, so an environment without the secret skips cleanly rather than
      # failing the promotion.
      #
      # The guard reads the job-level HAS_RAILWAY_TOKEN boolean, not the secret:
      # `secrets` is not an available context in a step-level `if:`, and a step's
      # own `env:` is applied only after its `if:` has been evaluated. Testing
      # either one from here resolves to empty, which skips the step while the
      # job still reports success — a silent no-op that looks like a deploy.
      #
      # RAILWAY_TOKEN must be a project-scoped token carrying the worker's
      # Railway project and environment; the service name must match Railway's.
      #
      # Deployed through a script rather than `railway up --ci`, which derives its
      # exit code from the build-LOG STREAM and so exits 1 when it merely loses
      # that connection. That happened on run #30923921869: the build went on to
      # succeed and the worker booted correctly, while CI reported failure and
      # SKIPPED the production smoke test below. The script detaches and polls
      # Railway for the deployment's real status instead.
      - name: Deploy worker (Railway)
        if: env.HAS_RAILWAY_TOKEN == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli
          node scripts/deploy/railway-worker-deploy.mjs worker

      # ── ENVIRONMENT GATE (layer 3) ──
      # Last, so it verifies the fully promoted system rather than a half-promoted one: web and
      # worker go up in lockstep, and only then is the result checked.
      #
      # Aimed at the canonical apex rather than the deployment URL, because absolute URLs in
      # emails and OAuth callbacks are built from APP_BASE_URL while next-auth cookies are
      # host-only — the host users actually reach is part of what has to work. Read from the
      # pulled env rather than hardcoded, so it cannot drift from what the app itself uses.
      #
      # This one DETECTS rather than prevents: nothing can test a deployment that does not exist
      # yet. A red result here means roll back with
      # `gh workflow run deploy.yml --ref <last-good-sha>`.
      - name: Smoke test production
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          BASE_URL=$(node -e 'process.loadEnvFile(".vercel/.env.production.local"); process.stdout.write(process.env.APP_BASE_URL ?? "")')
          test -n "$BASE_URL" || { echo "APP_BASE_URL is absent from the pulled production env"; exit 1; }
          node scripts/deploy/smoke.mjs "$BASE_URL"
