name: Nightly verification

# The scripts under scripts/concurrency/ and the contrast self-test prove things the unit suite
# structurally cannot: the unit suite mocks the database, so `tx.execute` is a no-op and deleting an
# advisory lock leaves every test green. They are run on demand, which is how the project's only
# concurrency proof sat broken for over a week without anyone noticing (CONCURRENCY-D3).
#
# Deliberately NOT here: scripts/retention/ needs real R2 credentials, and scripts/session/ needs a
# running app. Both stay on-demand until 6.5.INFRA provisions those in a managed environment.
#
# BOTH JOBS RUN ON PULL REQUESTS, and only `concurrency races` is required to merge. Nightly alone
# meant a broken lock was found the morning after it merged, by a notification nobody opened. The
# schedule stays because this workflow also proves the migrations apply from zero, which a pull
# request against an already-migrated branch does not.
#
# There is ONE definition of each job. Copying `concurrency races` into ci.yml to make it gate would
# leave two definitions to drift apart, which is the state DEBT-VERIFY-YML-UNPINNED describes, and
# an `if:` skipping the self-test on pull requests would be a condition that silently never fires.

on:
  schedule:
    # 19:00 UTC = 02:00 Asia/Jakarta, matching the retention job's off-peak slot.
    - cron: "0 19 * * *"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # A superseded pull-request run is measuring code nobody will merge, and this job holds a Postgres
  # service for up to 25 minutes. A scheduled run is never superseded and must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  concurrency-races:
    name: concurrency races
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lombakita_verify
        ports:
          - 5432:5432
        # Without a healthcheck the first migration races the server's startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lombakita_verify
      # A database-backed suite that cannot see a database SKIPS by default, which reports green.
      # This job stood one up, so an absent connection string here is a broken job rather than an
      # environment without Postgres — fail instead of quietly testing nothing.
      REQUIRE_DB_TESTS: "1"
      APP_ENV: test
      AUTH_SECRET: verification-only-secret-not-used-for-signing-anything-real
      # PLACEHOLDERS — there is no object storage in this job and nothing here reaches one.
      # institution-verification-submission.ts drives createVerificationSubmission, which presigns
      # an upload URL inside the transaction it is testing and refuses to run at all when storage
      # looks unconfigured. Presigning is a LOCAL signature computation over the credentials and
      # endpoint — no network call — so these satisfy the guard and let the advisory lock be tested,
      # while the URLs they produce point at a host that does not exist and are never fetched.
      # Verified by running that script against exactly these values before adding them.
      # Anything that genuinely READS OR WRITES bytes belongs in scripts/retention/, which is
      # excluded from this workflow until 6.5.INFRA provisions real storage.
      R2_ENDPOINT: https://placeholder.invalid
      R2_BUCKET: placeholder
      R2_ACCESS_KEY_ID: placeholder
      R2_SECRET_ACCESS_KEY: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:guarded

      - name: Confirm READ COMMITTED
        # Every post-lock count and CAS in the codebase is reasoned about under READ COMMITTED. The
        # scripts assert this themselves and refuse to run otherwise; failing here just makes the
        # cause obvious in the log rather than buried in the first script's output.
        #
        # Also the readiness gate for every DB-backed step below. It is the last step that has to
        # succeed for the database to be stood up, migrated and at the right isolation level, and a
        # step that is skipped reports `skipped` rather than `success`, so requiring this one to
        # have succeeded requires the migration above to have succeeded too.
        id: database-ready
        run: |
          psql "$DATABASE_URL" -tAc "SELECT current_setting('default_transaction_isolation')" \
            | grep -qx 'read committed'

      - name: Run concurrency race scripts
        run: npm run verify:concurrency

      # DEC-0142: the MFA constraint/lockout suite mocks nothing — it needs the real Postgres this
      # job already stood up and migrated above, and MFA_SECRET_ENCRYPTION_KEY is set by the test
      # file itself (a fixed, deterministic 32-byte key — never a real secret), so no extra env is
      # needed here.
      #
      # This is not the only place it runs: ci.yml stands up its own Postgres and runs every
      # DB-backed suite on every PR, which is where a broken constraint should be caught — on the PR
      # that broke it, not the next morning. Kept here deliberately, because the two jobs fail
      # independently and this one also exercises the suite against a database that has just been
      # migrated from zero.
      # Runs even when the race scripts above failed. The two subjects are independent, and by
      # default a failed step skips every step after it, so one broken fixture in the race scripts
      # silently took this suite out too and the job status could not show that it had.
      #
      # Scoped rather than `always()`, on two counts. A CANCELLED job must stop, not push on to
      # another suite. And this suite cannot produce a meaningful result if the database itself
      # never came up, so it is gated on the readiness step rather than run unconditionally: a
      # failure here should mean the MFA constraints are broken, never that Postgres is missing.
      - name: Run MFA DB-backed constraint and lifecycle suite
        if: ${{ !cancelled() && steps.database-ready.outcome == 'success' }}
        run: npx vitest run src/server/auth/mfa/mfa-schema-db.integration.test.ts

  contrast-selftest:
    name: contrast auditor self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The self-test needs no server and no database — the fixture is set with page.setContent() —
      # but it does need a real browser engine to compute styles.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run contrast auditor self-test
        run: npm run verify:contrast-selftest
